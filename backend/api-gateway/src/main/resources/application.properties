# Nombre del microservicio y puerto de escucha
spring.application.name=api-gateway
server.port=8080

# Registro y descubrimiento en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Habilita el localizador de descubrimiento por nombre de servicio
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-name=true

# CORS: el frontend React solo habla con el gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# 1. usuario-service
spring.cloud.gateway.routes[0].id=usuario-service
spring.cloud.gateway.routes[0].uri=lb://usuario-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/usuarios/**,/api/v1/auth/**

# 2. catalogo-service
spring.cloud.gateway.routes[1].id=catalogo-service
spring.cloud.gateway.routes[1].uri=lb://catalogo-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/productos/**,/api/v1/categorias/**,/api/v1/insumos/**

# 3. orden-service
spring.cloud.gateway.routes[2].id=orden-service
spring.cloud.gateway.routes[2].uri=lb://orden-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/ordenes/**,/api/v1/reportes/**

# 4. nutricion-service
spring.cloud.gateway.routes[3].id=nutricion-service
spring.cloud.gateway.routes[3].uri=lb://nutricion-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/nutricion/**

# 5. blog-service
spring.cloud.gateway.routes[4].id=blog-service
spring.cloud.gateway.routes[4].uri=lb://blog-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/articulos/**
