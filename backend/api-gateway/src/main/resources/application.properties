# Nombre del microservicio y puerto de escucha
spring.application.name=api-gateway
server.port=8080

# Registro y descubrimiento en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Solo se publican las rutas de abajo (sin rutas automáticas por nombre de servicio, que se saltarían los permisos)
spring.cloud.gateway.discovery.locator.enabled=false

# CORS: el frontend React solo habla con el gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# 1. usuario-service
spring.cloud.gateway.routes[0].id=usuario-service
spring.cloud.gateway.routes[0].uri=lb://usuario-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/usuarios/**,/api/v1/auth/**

# 2. catalogo-service
spring.cloud.gateway.routes[1].id=catalogo-service
spring.cloud.gateway.routes[1].uri=lb://catalogo-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/productos/**,/api/v1/categorias/**,/api/v1/insumos/**

# 3. orden-service
spring.cloud.gateway.routes[2].id=orden-service
spring.cloud.gateway.routes[2].uri=lb://orden-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/ordenes/**,/api/v1/reportes/**

# 4. nutricion-service
spring.cloud.gateway.routes[3].id=nutricion-service
spring.cloud.gateway.routes[3].uri=lb://nutricion-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/nutricion/**

# Swagger de los 4 servicios en una sola página: http://<gateway>/swagger-ui.html
# El JSON de cada servicio se pide por /docs/<servicio>/v3/api-docs y el Gateway le quita el prefijo
spring.cloud.gateway.routes[4].id=docs-usuarios
spring.cloud.gateway.routes[4].uri=lb://usuario-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/docs/usuarios/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/docs/usuarios/(?<resto>.*), /$\{resto}
spring.cloud.gateway.routes[5].id=docs-catalogo
spring.cloud.gateway.routes[5].uri=lb://catalogo-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/docs/catalogo/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/docs/catalogo/(?<resto>.*), /$\{resto}
spring.cloud.gateway.routes[6].id=docs-ordenes
spring.cloud.gateway.routes[6].uri=lb://orden-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/docs/ordenes/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/docs/ordenes/(?<resto>.*), /$\{resto}
spring.cloud.gateway.routes[7].id=docs-nutricion
spring.cloud.gateway.routes[7].uri=lb://nutricion-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/docs/nutricion/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/docs/nutricion/(?<resto>.*), /$\{resto}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=Usuarios
springdoc.swagger-ui.urls[0].url=/docs/usuarios/v3/api-docs
springdoc.swagger-ui.urls[1].name=Catalogo
springdoc.swagger-ui.urls[1].url=/docs/catalogo/v3/api-docs
springdoc.swagger-ui.urls[2].name=Ordenes
springdoc.swagger-ui.urls[2].url=/docs/ordenes/v3/api-docs
springdoc.swagger-ui.urls[3].name=Nutricion
springdoc.swagger-ui.urls[3].url=/docs/nutricion/v3/api-docs

# JWT: mismo secreto que usuario-service (variable de entorno JWT_SECRET, en base64)
jwt.secret=${JWT_SECRET:}
