spring.application.name=catalogo-service
server.port=8082

# Base de datos (en AWS se reemplaza con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_catalogo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true

# Registro en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Fotos de productos: carpeta media en el servidor
catalogo.media-dir=${MEDIA_DIR:./media}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
