spring.application.name=nutricion-service
server.port=8084

# Base de datos (en AWS se reemplaza con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_nutricion?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true

# Registro en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# API externa Spoonacular: la clave se lee de la variable de entorno SPOONACULAR_API_KEY
spoonacular.url=https://api.spoonacular.com
spoonacular.api-key=${SPOONACULAR_API_KEY:}
