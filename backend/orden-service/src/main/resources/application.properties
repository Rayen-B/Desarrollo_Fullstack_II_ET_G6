spring.application.name=orden-service
server.port=8083

# Base de datos (en AWS se reemplaza con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_papita_ordenes?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true

# Registro en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Transferencias: horas para pagar y cada cuánto se revisan las vencidas
ordenes.horas-plazo-transferencia=24
ordenes.revision-vencidas-ms=300000
