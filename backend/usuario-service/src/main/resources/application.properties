spring.application.name=usuario-service
server.port=8081

# Base de datos (en AWS se reemplaza con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_papita_usuarios?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true

# Registro en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# JWT: el secreto (base64, mínimo 32 bytes) se lee de la variable de entorno JWT_SECRET, igual que en el Gateway
jwt.secret=${JWT_SECRET:}
jwt.access-minutos=15
jwt.refresh-dias=7
